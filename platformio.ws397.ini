; Waveshare 3.97 fork build environments, loaded through extra_configs in platformio.ini.

; --- Waveshare ESP32-S3-ePaper-3.97 — ESP32-S3-WROOM-1-N16R8, SSD1677 800x480 --
; SDK profile ws397: AXP2101 PMIC (EPD rail, battery gauge), UP/OK/DOWN + BOOT
; keys (BOOT is Back and wake), PCF85063 RTC, 4-bit SDMMC card.
;   pio run -e ws397 -t upload

; Fork release version. Append .N for fork-only revisions on the same upstream
; base (1.6.5-ws397.1); drop it when porting to a new upstream tag.
[ws397]
version = ${crosspoint.version}-ws397

[env:ws397]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_WS397=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_WS397\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${ws397.version}\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; 4-bit SDMMC is mounted through SdFat's block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:ws397-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_WS397=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_WS397\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DCROSSPOINT_VERSION=\"${ws397.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
